# ===================================================================================
# PROMTAIL CONFIGURATION
# ===================================================================================
# 
# Simplified config that doesn't rely on docker_sd_configs which has API version issues
# Uses static file paths to collect Docker container logs
#
# ===================================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs - using file-based discovery
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      # Parse Docker JSON log format
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      # Try to parse container name from file path
      - regex:
          expression: '/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/'
          source: filename
      # Output the actual log message
      - output:
          source: log
      # Add labels
      - labels:
          stream:
          container_id:

  # GovConnect services logs - specific pattern matching
  - job_name: govconnect-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: govconnect
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      # Match govconnect containers by log content patterns
      - match:
          selector: '{job="govconnect"}'
          stages:
            - regex:
                expression: '.*(?P<service>channel-service|ai-service|case-service|notification-service|dashboard).*'
                source: log
            - labels:
                service:
      - output:
          source: log

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog

  - job_name: auth
    static_configs:
      - targets:
          - localhost
        labels:
          job: authlog
          __path__: /var/log/auth.log
