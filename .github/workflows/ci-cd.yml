# ===================================================================================
# SUPPORTING SERVICES - CI/CD PIPELINE
# ===================================================================================
# 
# Deploy supporting infrastructure (RabbitMQ, Grafana, Prometheus, Loki) to VPS
# No build needed - uses official images
#
# Required Secrets:
#   - VPS_HOST: VPS IP address
#   - VPS_USER: SSH username
#   - VPS_SSH_KEY: SSH private key
#
# ===================================================================================

name: Deploy Supporting Services

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.swarm.yml'
      - 'grafana/**'
      - 'prometheus/**'
      - 'loki/**'
      - 'promtail/**'
      - 'rabbitmq/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Supporting Services
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "🚀 Deploying Supporting Services to VPS..."
          
          # Copy all configs
          scp docker-compose.swarm.yml $VPS_USER@$VPS_HOST:/opt/apps/supporting/
          scp -r grafana $VPS_USER@$VPS_HOST:/opt/apps/supporting/
          scp -r prometheus $VPS_USER@$VPS_HOST:/opt/apps/supporting/
          scp -r loki $VPS_USER@$VPS_HOST:/opt/apps/supporting/
          scp -r promtail $VPS_USER@$VPS_HOST:/opt/apps/supporting/
          scp -r rabbitmq $VPS_USER@$VPS_HOST:/opt/apps/supporting/
          
          # Deploy
          ssh $VPS_USER@$VPS_HOST << 'ENDSSH'
            cd /opt/apps/supporting
            
            # Initialize swarm if needed
            if ! docker info | grep -q "Swarm: active"; then
              docker swarm init --advertise-addr $(hostname -I | awk '{print $1}') || true
            fi
            
            # Deploy stack
            docker stack deploy -c docker-compose.swarm.yml supporting
            
            # Wait and check
            sleep 15
            docker service ls | grep supporting
            
            echo "✅ Supporting services deployed!"
          ENDSSH

      - name: Health Check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sleep 20
          ssh $VPS_USER@$VPS_HOST << 'ENDSSH'
            echo "Checking services..."
            curl -sf http://localhost:3300/api/health && echo "✅ Grafana OK" || echo "❌ Grafana FAILED"
            curl -sf http://localhost:9090/-/healthy && echo "✅ Prometheus OK" || echo "❌ Prometheus FAILED"
            curl -sf http://localhost:15672 && echo "✅ RabbitMQ OK" || echo "❌ RabbitMQ FAILED"
          ENDSSH

      - name: Generate summary
        run: |
          echo "## 🚀 Supporting Services Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services:**" >> $GITHUB_STEP_SUMMARY
          echo "- Grafana: https://grafana.genfity.com" >> $GITHUB_STEP_SUMMARY
          echo "- RabbitMQ: https://rabbitmq.genfity.com" >> $GITHUB_STEP_SUMMARY
          echo "- Prometheus: https://prometheus.genfity.com" >> $GITHUB_STEP_SUMMARY
