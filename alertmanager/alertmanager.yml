# ===================================================================================
# ALERTMANAGER CONFIGURATION
# ===================================================================================

global:
  resolve_timeout: 5m
  # SMTP settings (uncomment and configure for email alerts)
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alerts@govconnect.my.id'
  # smtp_auth_username: 'your-email@gmail.com'
  # smtp_auth_password: 'your-app-password'

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-receiver'

receivers:
  - name: 'default-receiver'
    # Webhook receiver (dapat diubah ke Telegram, Slack, dll)
    webhook_configs:
      - url: 'http://gc-notification-service:3004/api/alerts/webhook'
        send_resolved: true

  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://gc-notification-service:3004/api/alerts/webhook'
        send_resolved: true
    # Uncomment for email alerts
    # email_configs:
    #   - to: 'admin@govconnect.my.id'
    #     send_resolved: true

  - name: 'warning-receiver'
    webhook_configs:
      - url: 'http://gc-notification-service:3004/api/alerts/webhook'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

templates: []
