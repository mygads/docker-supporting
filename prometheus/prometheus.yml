# ===================================================================================
# PROMETHEUS CONFIGURATION
# ===================================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'govconnect-monitor'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # GovConnect Services (using actual container names)
  - job_name: 'channel-service'
    static_configs:
      - targets: ['govconnect-channel-service:3001']
    metrics_path: /metrics
    scrape_timeout: 10s

  - job_name: 'ai-service'
    static_configs:
      - targets: ['govconnect-ai-service:3002']
    metrics_path: /metrics
    scrape_timeout: 10s

  - job_name: 'case-service'
    static_configs:
      - targets: ['govconnect-case-service:3003']
    metrics_path: /metrics
    scrape_timeout: 10s

  - job_name: 'notification-service'
    static_configs:
      - targets: ['govconnect-notification-service:3004']
    metrics_path: /metrics
    scrape_timeout: 10s

  - job_name: 'dashboard'
    static_configs:
      - targets: ['govconnect-dashboard:3000']
    metrics_path: /api/metrics
    scrape_timeout: 10s

  # RabbitMQ
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  # Traefik
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: /metrics

  # Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics

  # Genfity App
  - job_name: 'genfity-app'
    static_configs:
      - targets: ['genfity-app:8090']
    metrics_path: /api/metrics
    scrape_timeout: 10s

  # WhatsApp API
  - job_name: 'wa-api'
    static_configs:
      - targets: ['wa-api:8080']
    metrics_path: /metrics
    scrape_timeout: 10s

  # WA Support
  - job_name: 'wa-support'
    static_configs:
      - targets: ['wa-support:8082']
    metrics_path: /metrics
    scrape_timeout: 10s
