# ===================================================================================
# PROMETHEUS CONFIGURATION
# ===================================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'govconnect-monitor'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # GovConnect Services (using actual container names from docker-compose)
  - job_name: 'channel-service'
    static_configs:
      - targets: ['govconnect-channel-service-1:3001']
    metrics_path: /metrics

  - job_name: 'ai-service'
    static_configs:
      - targets: ['govconnect-ai-service-1:3002']
    metrics_path: /metrics

  - job_name: 'case-service'
    static_configs:
      - targets: ['govconnect-case-service-1:3003']
    metrics_path: /metrics

  - job_name: 'notification-service'
    static_configs:
      - targets: ['govconnect-notification-service-1:3004']
    metrics_path: /metrics

  - job_name: 'dashboard'
    static_configs:
      - targets: ['govconnect-dashboard-1:3000']
    metrics_path: /api/metrics

  # RabbitMQ
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  # Traefik
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: /metrics

  # PostgreSQL (via postgres_exporter if added)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics
