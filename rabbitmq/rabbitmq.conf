# ===================================================================================
# RABBITMQ CONFIGURATION
# ===================================================================================

# Management Plugin
# management.load_definitions = /etc/rabbitmq/definitions.json  # Disabled - using env vars

# Listeners
listeners.tcp.default = 5672

# Memory & Disk Limits
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Logging
log.console = true
log.console.level = info

# Queue Settings
queue_master_locator = min-masters

# Connection Settings
heartbeat = 60
