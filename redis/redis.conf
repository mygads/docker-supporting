# ===================================================================================
# REDIS CONFIGURATION
# ===================================================================================

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# Authentication (overridden by --requirepass in docker-compose)
# requirepass is set via command-line flag for easier env-var injection

# Persistence — AOF (primary) + RDB (backup)
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots
save 900 1
save 300 10
save 60 10000

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Performance
tcp-keepalive 300
timeout 0

# Security — disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
